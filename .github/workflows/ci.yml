name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  actualizar-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Añadir feature al README
        run: |
          echo "Añadida feature: ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" >> README.md

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "ci: actualizar README"
          git push

  validar-dev-token:
    runs-on: self-hosted
    needs: actualizar-readme

    steps:
      - name: Validar DEV_TOKEN
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -eq [Environment]::GetEnvironmentVariable("DEV_TOKEN", "Machine")) {
            Write-Host "Los tokens coinciden"
          }
          elseif ($env:DEV_TOKEN -eq [Environment]::GetEnvironmentVariable("DEV_TOKEN", "User")) {
            Write-Host "Los tokens coinciden"
          }
          else {
            Write-Host "Los tokens NO coinciden"
            exit 1
          }
