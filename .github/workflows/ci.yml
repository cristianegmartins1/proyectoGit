name: CI

permissions:
  contents: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  actualizar-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Añadir feature al README
        run: |
          echo "Añadida feature: ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" >> README.md

      - name: Guardar cambios
        if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "ci: actualizar README"
          git push origin HEAD:${GITHUB_REF_NAME}

  validar-dev-token:
    runs-on: self-hosted
    needs: actualizar-readme

    steps:
      - name: Validar DEV_TOKEN
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          $local = [Environment]::GetEnvironmentVariable("DEV_TOKEN","Machine")

          if (-not $local) {
            $local = [Environment]::GetEnvironmentVariable("DEV_TOKEN","User")
          }

          if ($env:DEV_TOKEN -eq $local) {
            Write-Host "Los tokens coinciden"
          }
          else {
            Write-Host "Los tokens NO coinciden"
            exit 1
          }
